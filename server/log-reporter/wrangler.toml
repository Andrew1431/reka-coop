# Deploying publishes a public URL on your Cloudflare account (see README.md).
name = "reka-coop-logs"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Ships inside the mod (Diagnostics/Uploader.cs), so it is not a secret: it only turns away stray requests.
UPLOAD_KEY = "reka-coop-playtest-1"
MAX_UPLOAD_BYTES = "1048576"    # gzip body
MAX_UNPACKED_BYTES = "8388608"  # after gunzip (zip bombs)
MIN_VERSION = "0.3.14"          # older mods get 426 and keep their reports on disk
MIN_PROTOCOL = "48"
KEEP_DAYS = "90"                # reports delete themselves after this long
# ADMIN_TOKEN is a secret: wrangler secret put ADMIN_TOKEN

# Workers KV (the account has no R2). The id is filled in by `wrangler kv namespace create REPORTS`.
[[kv_namespaces]]
binding = "REPORTS"
id = "cf37aaa4985948b7b5c134af28e08dc3"

# Per client IP. Periods can only be 10 or 60 seconds.
[[ratelimits]]
name = "UPLOAD_LIMIT"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
